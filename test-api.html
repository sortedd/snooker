<!DOCTYPE html>
<html>
<head>
    <title>Test Vercel KV API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #000; color: #fff; }
        button { padding: 15px 30px; font-size: 16px; background: #4ade80; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px 5px; }
        button:hover { background: #22c55e; }
        .result { margin-top: 20px; padding: 15px; background: #111; border-radius: 8px; white-space: pre-wrap; }
        .success { color: #4ade80; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>🧪 Test Vercel KV API</h1>
    
    <button onclick="testGET()">Test GET (Fetch Data)</button>
    <button onclick="testPOST()">Test POST (Save Data)</button>
    <button onclick="testHealth()">Test Health Check</button>
    
    <div id="result" class="result">Click a button to test...</div>
    
    <script>
        const API_BASE = 'https://snooker-sortedd.vercel.app/api/tournament';
        
        async function testGET() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Testing GET...</p>';
            
            try {
                const response = await fetch(API_BASE, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3 class="success">✅ GET Response</h3>
                    <p>Status: ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
        
        async function testPOST() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Testing POST...</p>';
            
            const testData = {
                players: [
                    { id: "p1", name: "Test Player 1" },
                    { id: "p2", name: "Test Player 2" }
                ],
                matches: [
                    { 
                        id: "m1", 
                        round: "Test Round", 
                        player1Id: "p1", 
                        player2Id: "p2",
                        status: "pending"
                    }
                ]
            };
            
            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3 class="success">✅ POST Response</h3>
                    <p>Status: ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p class="success">Now click "Test GET" to verify data was saved!</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
        
        async function testHealth() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Testing health check...</p>';
            
            try {
                const response = await fetch('https://snooker-sortedd.vercel.app/api/tournament?health=true', {
                    method: 'GET'
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>Health Check Response</h3>
                    <p>Status: ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
